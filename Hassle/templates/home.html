{% load static %}
<html>
<head>
    <title>Hassle College</title>
    <style>
        body {
            background-image: url("{% static 'bg.png' %}");
            background-size: cover;
            font-family: Arial, sans-serif;
        }
        #header {
            height: 100px;
            border: 1px solid black;
            display: flex;
            background: rgba(255, 255, 255, 0.5);
        }
        #logo {
            height: 100px;
            width: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            clip-path: circle(50%);
        }
        #heading {
            height: 100px;
            width: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #navi {
            height: 100px;
            width: 50%;
            display: flex;
            align-items: center;
        }
        #links ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            width: 100%;
            justify-content: space-around;
        }
        #links ul li {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
        }
        #links ul li:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        a {
            text-decoration: none;
            color: black;
        }
        #body {
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #body1 {
            width: 80%;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            text-align: center;
        }
        #footer {
            height: 100px;
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        #social a img:hover {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="logo">
            <img src="{% static 'college-logo.jpg' %}" height="80" width="80">
        </div>
        <div id="heading">
            <h1>Hassle College</h1>
        </div>
        <div id="navi">
            <div id="links">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="HS">Login</a></li>
                    <li><a href="HSR">Courses</a></li>
                    <li><a href="admissions">Admissions</a></li>
                    <li><a href="contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div id="body">
        <div id="body1">
            <p>
                Welcome to Hassle College, where education meets innovation. We provide top-notch academic programs to shape the future of our students.
            </p>
        </div>
    </div>
    <div id="footer">
        <div id="social">
            <a href="https://www.facebook.com"><img src="{% static 'fb.png' %}" height="30"></a>
            <a href="https://www.instagram.com"><img src="{% static 'insta.png' %}" height="30"></a>
            <a href="https://www.linkedin.com"><img src="{% static 'li.png' %}" height="30"></a>
            <a href="https://twitter.com"><img src="{% static 'x.png' %}" height="30"></a>
            <a href="https://youtube.com"><img src="{% static 'youtube.png' %}" height="30"></a>
        </div>
        <div id="address">
            <p>123 College Avenue, Academic City, Earth</p>
        </div>
    </div>
</body>
</html>
